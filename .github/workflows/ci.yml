# Intégration continue DIG! (ticket #17) : syntaxe + `npm test` sur chaque push (toutes
# branches) et chaque Pull Request visant main ou develop. Les tests utilisent des bases et dossiers temporaires et des ports
# 3105-3117 : aucun secret, aucune base réelle, aucun déploiement.
name: CI

on:
  push:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22']   # version de production (Node 20 est en fin de vie depuis avril 2026)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # test/deploy.test.js clone le dépôt et rejoue un déploiement git
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntaxe des fichiers JavaScript
        run: npm run check
      - name: Tests automatisés
        run: npm test
        timeout-minutes: 8
