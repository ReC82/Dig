# Drop-in systemd pour dig.service : secrets hors du dépôt (ticket #12).
# Installation (propriétaire) : voir docs/OPERATIONS.md, section « Secrets ».
#   sudo install -D -m 644 deploy/systemd/dig.service.d/secrets.conf /etc/systemd/system/dig.service.d/secrets.conf
# Le fichier /etc/dig/dig.env (root, mode 600, lu par systemd) contient :
#   SESSION_SECRET=<64 caractères hexadécimaux ou plus>
#   ADMIN_SECRET=<facultatif, ≥ 32 caractères ; absent = panel admin désactivé>
# Aucun secret dans ce fichier.
[Service]
EnvironmentFile=/etc/dig/dig.env
